<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Akbari Solution</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="login-page">

    <!-- دکمه بازگشت به صفحه قبل -->
    <a href="index.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Previous
    </a>

    <!-- بخش سمت چپ: عکس پس‌زمینه -->
    <div class="login-bg">
        <img src="assets/images/login-background.png" alt="Background">
        <div class="bg-overlay"></div>
        <div class="bg-content">
            <h1>Innovative Solutions <br> for a Better Future</h1>
            <p>Simple, reliable and modern software solutions to help individuals and businesses grow faster.</p>
        </div>
    </div>

    <!-- بخش سمت راست: فرم لاگین با انیمیشن -->
    <div class="login-form-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="assets/images/logo-vertical.png" alt="Akbari Solution Logo">
            </div>
            
            <h2>Login</h2>
            <p class="login-subtitle">Access your account to manage the website</p>

            <form action="dashboard.html" class="login-form">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" placeholder="Email Address" required>
                </div>
                
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="Password" required>
                    <i class="fas fa-eye toggle-password"></i>
                </div>

                <button type="submit" class="btn-login">Login <i class="fas fa-arrow-right"></i></button>
            </form>
            
            <div class="login-footer">
                <p>&copy; 2026 Akbari Solution. All rights reserved.</p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
<script src="js/auth.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/global-settings.js"></script>
    <script src="js/main.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
